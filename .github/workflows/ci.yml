name: CI — Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Validate required environment variables
        run: |
          missing=""
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ]; then missing="${missing} VITE_SUPABASE_URL"; fi
          if [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then missing="${missing} VITE_SUPABASE_ANON_KEY"; fi
          if [ -n "${missing}" ]; then echo "ERROR: Missing required secrets:${missing}"; exit 1; fi

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
